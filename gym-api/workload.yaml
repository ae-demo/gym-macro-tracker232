apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: gym-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: gym-macro-tracker-b30d7902
      envBindings:
        dbname: GYM_DB_DBNAME
        host: GYM_DB_HOST
        password: GYM_DB_PASSWORD
        port: GYM_DB_PORT
        user: GYM_DB_USER
    - ref: gym-macro-tracker-8b26af6e
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
